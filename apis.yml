name: Bedrock Materials
description: 'Bedrock Materials was a Chicago-based deep-tech startup founded in 2023 by Spencer Gore (CEO,
  previously Tesla and Enovix) and Rafael Vila (CTO, Stanford battery scientist) to manufacture engineered
  sodium-ion cathode active materials as a low-cost, easy-to-source alternative to lithium-ion — built from
  abundant sodium, manganese, iron and aluminum, and designed to drop into existing lithium-ion cell manufacturing
  lines for low-voltage, starter-lighting-ignition, micromobility and industrial-traction applications. It
  raised a $9M seed round led by Trucks Venture Capital with Refactor Capital and Version One Ventures. In
  April 2025 the company wound down and returned the majority of that seed capital to its investors: CEO
  Spencer Gore concluded that sodium-ion could not be produced cheaply enough to beat lithium iron phosphate
  (LFP) after lithium oversupply collapsed prices, and that energy-density gains carried steep trade-offs.
  Bedrock Materials was a materials-science manufacturer and never operated a developer program, public API,
  or developer portal; both bedrockmaterials.com and its former bedrock.inc website are now parked/for-sale
  domains with no company content. This profile is retained as a verified-defunct record in the API Evangelist
  network — there is no API surface to enrich.'
